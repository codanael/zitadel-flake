name: update

# Deliberately limited triggers: nothing a third party can drive. No
# pull_request_target, issue_comment, or issues — this CI holds secrets.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      # First real step on purpose: `--check` needs only curl/python3/sed, so
      # the steady-state night (nothing newer, closure already cached) never
      # pays for free-disk-space, KVM or a Nix install.
      #
      # `--check` exits 1 both when there's nothing newer (handled below) and
      # on a genuine failure before the "current=" line is printed — so we
      # distinguish success (0) or a "clean" failure (1 with a current= line)
      # from everything else, which fails the job loudly.
      - name: Detect a newer version
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          output="$(./scripts/update-zitadel.sh --check)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          printf '%s\n' "$output" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$rc" -eq 1 ] && printf '%s\n' "$output" | grep -q '^current='; then
            echo "No newer upstream version: not an error, nothing to do."
            exit 0
          fi
          echo "::error::update-zitadel.sh --check failed unexpectedly (code $rc) — not to be confused with 'no update available'."
          exit 1

      # A newer major is never auto-selected by the check above (v4 must keep
      # getting v4 patches after v5 exists) — surface it so it isn't silently lost.
      - name: Note newer major (not auto-applied)
        if: steps.check.outputs.major_available != ''
        run: |
          echo "::warning::Zitadel ${{ steps.check.outputs.major_available }} is available upstream (current major: ${{ steps.check.outputs.current }}). It is never auto-selected; bump it manually when ready."

      # Only an evaluation, no build: enough to learn the output path and ask
      # Cachix whether it already has it. Skipped when an update is pending,
      # since applying one changes the path this would have measured.
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342   # v31.11.0
        if: steps.check.outputs.latest == ''
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # A repo bootstrapped at (or later settled back at) upstream's current
      # release would otherwise never publish anything: build/test/push used
      # to be gated on "an update was applied", so on every steady-state
      # night — most nights — the job did nothing and the cache stayed
      # empty forever. Publication must be self-healing like the tag
      # reconciliation below: every run ends with the committed version's
      # closure in Cachix, updated or not.
      - name: Check whether the committed version is already cached
        id: cached
        if: steps.check.outputs.latest == ''
        run: |
          OUT="$(nix eval --raw .#zitadel)"
          HASH="$(basename "$OUT" | cut -d- -f1)"
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' "https://codanael-zitadel.cachix.org/$HASH.narinfo")"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = "200" ]; then
            echo "cached=true" >> "$GITHUB_OUTPUT"
            echo "$OUT already on Cachix ($HASH.narinfo -> $CODE) — nothing to build, test, or push."
          else
            echo "cached=false" >> "$GITHUB_OUTPUT"
            echo "$OUT not on Cachix ($HASH.narinfo -> $CODE) — will build, test, and push."
          fi

      # One decision, evaluated once, so the gate below can't drift between
      # steps. Values reach the shell as env, never interpolated into it.
      - name: Decide whether this run has build work
        id: work
        env:
          LATEST: ${{ steps.check.outputs.latest }}
          CACHED: ${{ steps.cached.outputs.cached }}
        run: |
          if [ -n "$LATEST" ] || [ "$CACHED" != "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Build work needed (update pending, or committed version absent from the cache)."
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to build: no newer version and the committed closure is already cached."
          fi

      # Everything below this line costs real runner minutes, so it all hangs
      # off the single gate above. The Go + Angular + VM-image chain does not
      # fit in the runner's stock free space, and the VM test needs /dev/kvm.
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be   # v1.3.1
        if: steps.work.outputs.needed == 'true'
        with:
          tool-cache: true
          large-packages: true

      - name: Enable KVM
        if: steps.work.outputs.needed == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Re-run on the update path, where the evaluation above was skipped.
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342   # v31.11.0
        if: steps.work.outputs.needed == 'true' && steps.check.outputs.latest != ''
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71   # v17
        if: steps.work.outputs.needed == 'true'
        with:
          name: codanael-zitadel
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Apply the update
        if: steps.check.outputs.latest != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update-zitadel.sh

      # Guards against a release landing between the check and apply calls,
      # which independently re-query the API: fail loudly instead of shipping
      # a PR titled for one version but built from another.
      - name: Verify applied version matches detected version
        if: steps.check.outputs.latest != ''
        run: |
          APPLIED="$(sed -n 's/^  version = "\([^"]*\)";.*/\1/p' pkgs/zitadel/default.nix | head -1)"
          if [ "$APPLIED" != "${{ steps.check.outputs.latest }}" ]; then
            echo "::error::Applied version ($APPLIED) does not match the version detected earlier (${{ steps.check.outputs.latest }}) — upstream released a newer version mid-run."
            exit 1
          fi

      # Never pushed before its VM test passes, whichever path got us here:
      # a just-applied update or a steady-state re-publish of the committed
      # version. Not a double build/push on the update path — this is the
      # only Build/Test/Push in the job.
      - name: Build
        if: steps.work.outputs.needed == 'true'
        run: nix build .#zitadel -L

      - name: Test in VM
        if: steps.work.outputs.needed == 'true'
        run: nix build .#checks.x86_64-linux.zitadel-pg18 -L

      - name: Push to Cachix
        id: push
        if: steps.work.outputs.needed == 'true'
        run: |
          nix build .#zitadel --no-link --print-out-paths \
            | cachix push codanael-zitadel
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Open the PR
        if: steps.check.outputs.latest != ''
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1   # v8.1.1
        with:
          branch: update/zitadel-${{ steps.check.outputs.latest }}
          title: "chore: Zitadel ${{ steps.check.outputs.latest }}"
          commit-message: "chore: Zitadel ${{ steps.check.outputs.latest }}"
          labels: ${{ steps.check.outputs.kind == 'major' && 'major' || 'auto' }}
          body: |
            Automatic bump to Zitadel ${{ steps.check.outputs.latest }}
            (${{ steps.check.outputs.kind }}).

            Build and PostgreSQL 18 VM test passed. Closure is on Cachix.

      # Majors are never auto-merged.
      - name: Merge (minor/patch only)
        if: steps.check.outputs.kind == 'minor' && steps.pr.outputs.pull-request-number != ''
        id: merge
        run: |
          PR="${{ steps.pr.outputs.pull-request-number }}"
          gh pr merge --squash --delete-branch "$PR"
          # Get the merge commit SHA as GitHub created it, not origin/main's
          # tip (which may have moved), so we don't tag the wrong commit.
          MERGE_SHA="$(gh pr view "$PR" --json mergeCommit -q .mergeCommit.oid)"
          echo "sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Retries a tag push a past run failed to land (network blip, ref lock):
      # nothing else would ever notice, since the version already reads as
      # current, and `v4` is the entire consumer contract. Pure git, no Nix,
      # so it still works on the cheap path where Nix was never installed.
      #
      # Gated on the closure being verified — either already on Cachix, or
      # built, VM-tested and pushed by this run. Without that gate it tracked
      # main's tip, so any commit that touches no package file at all (a README
      # edit, a workflow tweak) still dragged the consumer-facing tags onto a
      # revision no VM test had ever seen.
      - name: Reconcile floating tags with main
        if: >
          !cancelled() &&
          (steps.cached.outputs.cached == 'true' || steps.push.outcome == 'success')
        run: |
          git fetch origin --tags main
          SHA="$(git rev-parse origin/main)"
          CUR="$(git show "$SHA:pkgs/zitadel/default.nix" | sed -n 's/^  version = "\([^"]*\)";.*/\1/p' | head -1)"
          if [ -z "$CUR" ]; then
            echo "::error::Could not read the version off origin/main ($SHA); not touching tags."
            exit 1
          fi
          # `vX.Y.Z` is immutable per the README: created once, never moved.
          # Only `vX` and `latest` float.
          if git rev-parse -q --verify "refs/tags/v$CUR" >/dev/null; then
            echo "v$CUR already exists — immutable, left alone."
          else
            echo "Creating v$CUR -> $SHA"
            git tag "v$CUR" "$SHA"
            git push origin "refs/tags/v$CUR"
          fi
          for TAG in "v${CUR%%.*}" latest; do
            TAG_SHA="$(git rev-parse -q --verify "refs/tags/$TAG" || true)"
            if [ "$TAG_SHA" != "$SHA" ]; then
              echo "Moving $TAG -> $SHA (was ${TAG_SHA:-<missing>})"
              git tag -f "$TAG" "$SHA"
              git push -f origin "refs/tags/$TAG"
            fi
          done
